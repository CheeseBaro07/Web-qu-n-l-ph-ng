<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>Đăng nhập - Quản lý phòng học</title>
  <link href="css/style.css" rel="stylesheet"/>
  <link href="css/decor.css" rel="stylesheet"/>
  <link href="css/dangnhap.css" rel="stylesheet"/>
</head>
<body data-page="login" class="login-body">
  <main class="login-wrap">
    <section class="login-hero">
      <h1>Quản lý phòng học</h1>
      <p>Tìm phòng trống, đăng ký khung giờ và theo dõi lịch sử dụng phòng trong toàn trường.</p>
    </section>
    <section class="login-card">
      <h2>Đăng nhập</h2>
      <form id="loginForm" autocomplete="off">
        <label for="username">Tên đăng nhập</label>
        <input id="username" required autofocus placeholder="Nhập tên đăng nhập"/>
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" required placeholder="Nhập mật khẩu"/>
        <label class="check"><input id="showPass" type="checkbox"/> Hiện mật khẩu</label>
        <p id="loginMessage" role="alert"></p>
        <button class="button block" type="submit">Đăng nhập</button>
      </form>
      <div class="demo">
        <p class="muted">Tài khoản mẫu (bấm để đăng nhập ngay):</p>
        <button type="button" class="demo-btn" data-user="admin" data-pass="admin123">
          <strong>Quản trị viên</strong><span>admin / admin123 · toàn quyền</span>
        </button>
        <button type="button" class="demo-btn" data-user="giangvien" data-pass="gv123">
          <strong>Giảng viên</strong><span>giangvien / gv123 · không thêm/sửa/xóa phòng</span>
        </button>
        <button type="button" class="demo-btn" data-user="sinhvien" data-pass="sv123">
          <strong>Sinh viên</strong><span>sinhvien / sv123 · chỉ xem lịch, lọc lịch, tìm phòng</span>
        </button>
      </div>
    </section>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
